name: Test
on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Record runtime
        run: |
          mkdir -p test-logs
          python -c "import platform, sqlite3, sys; print(sys.version); print(platform.platform()); print('SQLite', sqlite3.sqlite_version)" | tee test-logs/runtime.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-mcp.txt 2>&1 | tee test-logs/install.txt
      - name: Check dependencies
        run: |
          python -m pip freeze > test-logs/dependencies.txt
          python -m pip check 2>&1 | tee test-logs/pip-check.txt
      - name: Full backend regression (includes approval ledger)
        run: python -m unittest discover -s tests -v 2>&1 | tee test-logs/tests.txt
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-python-${{ matrix.python }}
          path: test-logs/
          if-no-files-found: ignore
          retention-days: 14
